---
# Deploys / updates the app on AKS and verifies it is reachable.
# Usage: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e image=<acr>/cia-app:<tag>
# Needs env: KUBECONFIG, ACR_SERVER, ACR_USERNAME, ACR_PASSWORD
- name: Deploy cia-app to Azure Kubernetes Service
  hosts: deployer
  gather_facts: false
  vars:
    k8s_dir: "{{ playbook_dir }}/../k8s"
    rendered: /tmp/cia-deployment.yaml

  tasks:
    - name: Fail early if image is not provided
      ansible.builtin.assert:
        that: image is defined and image | length > 0
        fail_msg: "Pass the image with -e image=<registry>/cia-app:<tag>"

    - name: Create / update the ACR image pull secret
      ansible.builtin.shell: |
        kubectl create secret docker-registry acr-secret \
          --docker-server="$ACR_SERVER" \
          --docker-username="$ACR_USERNAME" \
          --docker-password="$ACR_PASSWORD" \
          --dry-run=client -o yaml | kubectl apply -f -
      no_log: true
      changed_when: true

    - name: Render deployment manifest with the new image tag
      ansible.builtin.copy:
        content: "{{ lookup('file', k8s_dir + '/deployment.yaml') | replace('IMAGE_PLACEHOLDER', image) }}"
        dest: "{{ rendered }}"
        mode: "0600"

    - name: Apply Deployment and Service
      ansible.builtin.command: "kubectl apply -f {{ rendered }} -f {{ k8s_dir }}/service.yaml"
      register: apply_out
      changed_when: "'configured' in apply_out.stdout or 'created' in apply_out.stdout"

    - name: Wait for the rolling update to finish
      ansible.builtin.command: kubectl rollout status deployment/cia-app --timeout=240s
      changed_when: false

    - name: Wait for the LoadBalancer public IP
      ansible.builtin.command: >
        kubectl get svc cia-app-svc -o jsonpath={.status.loadBalancer.ingress[0].ip}
      register: lb_ip
      until: lb_ip.stdout | length > 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Check the application answers on /health
      ansible.builtin.uri:
        url: "http://{{ lb_ip.stdout }}/health"
        return_content: true
      register: health
      until: health.status == 200 and health.json.status == 'UP'
      retries: 12
      delay: 5

    - name: Show endpoint
      ansible.builtin.debug:
        msg: "App is live at http://{{ lb_ip.stdout }}  ->  {{ health.json }}"
