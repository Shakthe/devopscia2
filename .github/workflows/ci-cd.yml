name: CI-CD Pipeline

# Runs automatically on every push to main (full build + deploy) and on pull requests (build + scans only)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  IMAGE_NAME: cia-app

jobs:
  build-test:
    name: 1. Build & Test (Maven)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: mvn -B clean compile

      - name: Run unit tests
        run: mvn -B test

      - name: Package JAR
        run: mvn -B package -DskipTests

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          detailed_summary: true
          include_passed: true

      - name: SonarCloud code analysis
        if: env.SONAR_TOKEN != ''
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Upload JAR for the Docker stage
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  secret-scan:
    name: 2. Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks (scan full git history for secrets)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose --exit-code 1

  docker:
    name: 3. Build & Push Docker Image (ACR)
    needs: [build-test, secret-scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Compute image tag
        id: meta
        run: echo "image=${{ secrets.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and tag image
        run: |
          docker build --build-arg BUILD_SHA=${GITHUB_SHA::7} \
            -t ${{ steps.meta.outputs.image }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:latest .

      - name: Push image to ACR
        run: docker push --all-tags ${{ secrets.ACR_LOGIN_SERVER }}/${IMAGE_NAME}

  deploy:
    name: 4. Deploy to AKS (Ansible) & Verify
    needs: docker
    runs-on: ubuntu-latest
    env:
      ACR_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      KUBECONFIG: /home/runner/.kube/config
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl for AKS
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get nodes

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Deploy with Ansible playbook
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e image=${{ needs.docker.outputs.image }}

      - name: Verify deployment status and availability
        run: |
          kubectl get deployment cia-app
          kubectl get pods -l app=cia-app -o wide
          kubectl get svc cia-app-svc
          IP=$(kubectl get svc cia-app-svc -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -fsS "http://$IP/health"
          echo "### Deployed ${{ needs.docker.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "App URL: http://$IP" >> "$GITHUB_STEP_SUMMARY"
