services:
  jenkins:
    build: .
    container_name: jenkins
    user: root                      # needed to use the host Docker socket
    ports:
      - "127.0.0.1:8081:8080"       # Jenkins UI at http://localhost:8081 (localhost only)
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
