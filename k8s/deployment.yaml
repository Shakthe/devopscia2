apiVersion: apps/v1
kind: Deployment
metadata:
  name: cia-app
  labels:
    app: cia-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cia-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cia-app
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: cia-app
          image: IMAGE_PLACEHOLDER   # replaced by the pipeline with <acr>/cia-app:<git-sha>
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
